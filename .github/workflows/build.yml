name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Files and Build Properties
        run: |
          # 1. google-services.json সঠিক নামে app ফোল্ডারে কপি করা
          mkdir -p app
          cp "google-services (1).json" app/google-services.json || true
          cp "google-services (1).json" google-services.json || true
          
          # 2. AndroidX এবং AAR মেটাডাটা চেক বন্ধের ফ্ল্যাগ যুক্ত করা
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.configuration-cache=false
          android.suppressUnsupportedCompileSdk=35
          EOF

          # 3. প্লাগইন ভার্সন ঠিক রাখা
          grep -rl '9\.1\.1' . | xargs sed -i 's/9\.1\.1/8.7.3/g' || true

      - name: Setup Gradle 8.9 Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug -x checkDebugAarMetadata --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySchoolApp-APK
          path: app/build/outputs/apk/debug/*.apk
