name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Incompatible SDK and Plugin Syntax
        run: |
          # ভুল প্লাগইন ভার্সন সংশোধন
          grep -rl '9\.1\.1' . | xargs sed -i 's/9\.1\.1/8.7.3/g' || true
          
          # অপ্রচলিত compileSdk সিনট্যাক্স সংশোধন
          find . -name "build.gradle.kts" -exec sed -i -E 's/compileSdk\(version = release\([0-9]+\)(.*)\)/compileSdk = 35/g' {} +
          find . -name "build.gradle.kts" -exec sed -i -E 's/targetSdk\(version = release\([0-9]+\)(.*)\)/targetSdk = 35/g' {} +
          find . -name "build.gradle.kts" -exec sed -i '/minorApiLevel/d' {} +
          
          # ক্যাশ ডিক্লেয়ারেশন সরানো
          echo "org.gradle.configuration-cache=false" >> gradle.properties

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Generate Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySchoolApp-APK
          path: app/build/outputs/apk/debug/*.apk
